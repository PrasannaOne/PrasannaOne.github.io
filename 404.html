<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#171321">
  <meta name="robots" content="noindex">
  <title>404 · One More Life? · PrasannaOne</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23171321'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Georgia,serif' font-size='43' fill='%23e8d9ff'%3EP.%3C/text%3E%3C/svg%3E">
  <style>
    *{box-sizing:border-box} :root{color-scheme:dark} body{margin:0;min-height:100svh;background:#171321;color:#f1eafa;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;display:grid;place-items:center;padding:22px;overflow-x:hidden}
    main{width:min(100%,660px);text-align:center}.eyebrow{color:#a994c7;font-size:10px;letter-spacing:.2em;margin-bottom:12px}.title{font:500 clamp(34px,8vw,54px)/1 Georgia,serif;letter-spacing:-.045em;margin:0}.title em{color:#c8a8ff;font-weight:400}.sub{color:#a69bb5;font:12px/1.6 system-ui,sans-serif;margin:12px 0 22px}
    .cabinet{border:1px solid #554568;background:#211b2e;padding:12px;border-radius:15px;box-shadow:0 18px 70px #08060d80}.topline{display:flex;justify-content:space-between;gap:10px;padding:2px 4px 11px;color:#cdbce4;font-size:10px;letter-spacing:.12em}.topline strong{color:#f4dc8b;font-weight:600}canvas{display:block;width:100%;height:auto;aspect-ratio:600/390;background:#100d18;border:1px solid #493b5a;border-radius:7px;touch-action:none;image-rendering:pixelated}
    .controls{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0 0}.btn{border:1px solid #79628e;background:#332743;color:#f5edff;border-radius:7px;padding:11px 17px;font:600 11px ui-monospace,monospace;letter-spacing:.08em;cursor:pointer}.btn.primary{background:#d8c0ff;color:#21172e;border-color:#d8c0ff}.btn:focus-visible,a:focus-visible{outline:2px solid #f4dc8b;outline-offset:4px}.hint{color:#9386a3;font:10px/1.6 system-ui,sans-serif;margin:12px 0 0}.bottom{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:20px;font:10px ui-monospace,monospace;color:#81758f}.bottom a{color:#cbb5e9;text-decoration:none}.bottom a:hover{text-decoration:underline}.tag{color:#70657c}
    @media(max-width:480px){body{padding:16px}.cabinet{padding:8px}.topline{font-size:9px}.sub{margin-bottom:16px}.btn{padding:12px 15px}.hint{max-width:300px;margin-inline:auto}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">PRASANNAONE ARCADE · ERROR 404</div>
    <h1 class="title">Wrong turn.<br><em>Right game.</em></h1>
    <p class="sub">This page wandered off. Keep the ball alive while you're here.</p>
    <section class="cabinet" aria-label="Retro brick breaker game">
      <div class="topline"><span>SCORE <strong id="score">0000</strong></span><span>BEST <strong id="best">0000</strong></span><span>LIVES <strong id="lives">♥ ♥ ♥</strong></span></div>
      <canvas id="game" width="600" height="390" aria-label="Brick breaker game. Move the paddle with arrow keys, mouse or touch."></canvas>
      <div class="controls"><button class="btn primary" id="start">START GAME</button><button class="btn" id="pause">PAUSE</button></div>
      <p class="hint" id="hint">← → or A / D to move · drag on the game on touch screens</p>
    </section>
    <div class="bottom"><a href="/">← BACK TO PRASANNAONE</a><span class="tag">INSERT COIN? NO COIN NEEDED.</span></div>
  </main>
<script>
(()=>{
  const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
  const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),livesEl=document.getElementById('lives'),hint=document.getElementById('hint');
  const W=600,H=390, paddle={x:260,y:354,w:80,h:9}, ball={x:300,y:330,r:6,vx:3.1,vy:-3.7};
  let bricks=[],score=0,lives=3,running=false,paused=false,started=false,raf=0,keys={},best=0;
  try{best=Number(localStorage.getItem('p1-404-best')||0)}catch(e){} bestEl.textContent=fmt(best);
  const colors=['#d6b8ff','#a98bd0','#8b79b5','#e7c982'];
  function fmt(n){return String(n).padStart(4,'0')}
  function ui(){scoreEl.textContent=fmt(score);livesEl.textContent=Array.from({length:3},(_,i)=>i<lives?'♥':'·').join(' ')}
  function resetBricks(){bricks=[];for(let r=0;r<4;r++)for(let c=0;c<9;c++)bricks.push({x:25+c*62,y:48+r*25,w:52,h:13,on:true,color:colors[r]})}
  function resetBall(){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-12;ball.vx=(Math.random()>.5?1:-1)*3.1;ball.vy=-3.7}
  function newGame(){score=0;lives=3;paddle.x=(W-paddle.w)/2;resetBricks();resetBall();started=true;paused=false;running=true;document.getElementById('start').textContent='RESTART';document.getElementById('pause').textContent='PAUSE';hint.textContent='← → or A / D to move · drag on the game on touch screens';ui();cancelAnimationFrame(raf);loop()}
  function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#100d18';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#211a2b';ctx.lineWidth=1;for(let x=20;x<W;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=20;y<H;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
    bricks.forEach(b=>{if(!b.on)return;ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#ffffff35';ctx.fillRect(b.x+2,b.y+2,b.w-4,2)});
    ctx.fillStyle='#e8d9ff';ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);ctx.fillStyle='#b99ae5';ctx.fillRect(paddle.x+8,paddle.y+2,paddle.w-16,2);
    ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='#f4dc8b';ctx.shadowColor='#f4dc8b';ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;
    if(!started||paused||!running){ctx.fillStyle='#100d18b8';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#f0e6ff';ctx.font='bold 19px monospace';ctx.fillText(!started?'READY PLAYER ONE':paused?'PAUSED':lives<=0?'GAME OVER':'STAGE CLEAR',W/2,H/2-4);ctx.fillStyle='#b7a7ca';ctx.font='11px monospace';ctx.fillText(!started?'PRESS START TO PLAY':paused?'PRESS RESUME TO CONTINUE': 'PRESS RESTART TO PLAY AGAIN',W/2,H/2+22)}
  }
  function finish(){running=false;cancelAnimationFrame(raf);draw();hint.textContent=lives<=0?'Game over. Fancy another round?':'All clear! You smashed every brick.';document.getElementById('start').textContent='PLAY AGAIN'}
  function loop(){if(!running||paused)return;update();draw();raf=requestAnimationFrame(loop)}
  function update(){if(keys.ArrowLeft||keys.a||keys.A)paddle.x-=6;if(keys.ArrowRight||keys.d||keys.D)paddle.x+=6;paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));ball.x+=ball.vx;ball.y+=ball.vy;
    if(ball.x<ball.r||ball.x>W-ball.r)ball.vx*=-1;if(ball.y<ball.r)ball.vy=Math.abs(ball.vy);
    if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){let hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.vx=hit*4.8;ball.vy=-Math.max(3.2,Math.sqrt(26-ball.vx*ball.vx))}
    for(const b of bricks){if(!b.on)continue;if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){b.on=false;ball.vy*=-1;score+=10;ui();if(score>best){best=score;bestEl.textContent=fmt(best);try{localStorage.setItem('p1-404-best',best)}catch(e){}}break}}
    if(ball.y>H+10){lives--;ui();if(lives<=0){finish();return}resetBall()}
    if(bricks.every(b=>!b.on)){finish();return}
  }
  function moveTo(e){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W;paddle.x=Math.max(0,Math.min(W-paddle.w,x-paddle.w/2))}
  window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key===' '&&started){if(paused)resume();else pause()}});
  window.addEventListener('keyup',e=>keys[e.key]=false);
  canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture?.(e.pointerId);moveTo(e)});canvas.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')moveTo(e)});
  function pause(){if(!running)return;paused=true;document.getElementById('pause').textContent='RESUME';cancelAnimationFrame(raf);draw()}
  function resume(){if(!running)return;paused=false;document.getElementById('pause').textContent='PAUSE';loop()}
  document.getElementById('start').addEventListener('click',newGame);document.getElementById('pause').addEventListener('click',()=>{if(!started){newGame();return}paused?resume():pause()});
  resetBricks();resetBall();draw();ui();
})();
</script>
